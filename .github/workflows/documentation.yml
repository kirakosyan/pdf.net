name: Documentation source consumers
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'specs/**'
      - 'src/**'
      - 'eng/Documentation/**'
      - 'eng/test-documentation.ps1'
      - 'eng/test-recipes.py'
      - 'eng/check-documentation.py'
      - 'examples/**'
      - '.github/workflows/documentation.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    name: Documentation (${{ matrix.id }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: win-x64, os: windows-latest }
          - { id: win-arm64, os: windows-11-arm }
          - { id: linux-x64, os: ubuntu-latest }
          - { id: linux-arm64, os: ubuntu-24.04-arm }
          - { id: osx-x64, os: macos-15-intel }
          - { id: osx-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            10.0.402
            8.0.426
      - name: Build exact source documentation and consumers
        shell: pwsh
        run: |
          dotnet restore Fluent.Pdf.slnx --locked-mode --disable-parallel -m:1
          if ($LASTEXITCODE -ne 0) { throw 'Locked documentation/source restore failed.' }
          dotnet build Fluent.Pdf.slnx -c Release --no-restore -m:1 -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Documentation/source build failed.' }
      - name: Check reference and execute actual source recipes
        shell: pwsh
        run: ./eng/test-documentation.ps1
      - name: Retain exact documentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-source-${{ matrix.id }}
          path: artifacts/contracts/documentation/
          if-no-files-found: error
