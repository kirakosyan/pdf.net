name: Publish qualified stable packages
on:
  workflow_run:
    workflows: ['Source contracts and release guard']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:
    inputs:
      verify_publisher_only:
        description: Check NuGet trusted-publisher login without creating or uploading packages
        required: false
        default: false
        type: boolean
      tag:
        description: Stable main-branch tag, for example v1.0.0
        required: false
        type: string
      qualification_run:
        description: Successful production-qualification workflow run ID
        required: false
        type: string
      artifact_id:
        description: Immutable qualified artifact ID containing packages and evidence
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: fluent-pdf-production-publish
  cancel-in-progress: false
jobs:
  verify-publisher:
    if: github.repository == 'kirakosyan/pdf.net' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verify_publisher_only))
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: publisher
        with:
          user: kirakosyan
      - name: Confirm account-side trusted-publisher authorization
        shell: bash
        env:
          PUBLISHER_TOKEN: ${{ steps.publisher.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$PUBLISHER_TOKEN"
          echo 'NuGet accepted the kirakosyan/pdf.net publish.yml identity in environment nuget. No packages were created or uploaded; package scopes and production qualification remain separate checks.' >> "$GITHUB_STEP_SUMMARY"
  verify:
    if: github.event_name == 'workflow_dispatch' && !inputs.verify_publisher_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify stable tag, main and qualification provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
          QUALIFIED_ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Dispatch only from main.' }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Stable tag required.' }
          if ($env:QUALIFICATION_RUN -notmatch '^\d+$' -or $env:QUALIFIED_ARTIFACT_ID -notmatch '^\d+$') { throw 'Numeric run/artifact IDs required.' }
          $head = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $head) { throw 'Tag must match the current main commit.' }
          $readiness = Get-Content specs/release-readiness.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -cne "v$($readiness.packageVersion)") { throw 'Tag/package version mismatch.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:QUALIFICATION_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $head -or $run.conclusion -cne 'success' -or $run.event -notin @('workflow_dispatch','push') -or $run.head_repository.full_name -cne $env:GITHUB_REPOSITORY -or $run.path -cne ".github/workflows/$($readiness.qualificationWorkflow)") { throw 'Untrusted or unsuccessful qualification run.' }
          $artifact = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:QUALIFIED_ARTIFACT_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.expired -or $artifact.workflow_run.id -ne [long]$env:QUALIFICATION_RUN) { throw 'Artifact does not belong to the qualification run.' }
      - name: Download exact qualification artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:QUALIFIED_ARTIFACT_ID/zip" > qualified.zip
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed.' }
          Expand-Archive qualified.zip qualified
          ./eng/assert-production-ready.ps1 -Stage Publish -EvidenceDirectory qualified/evidence -PackageDirectory qualified/packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: verified
        with:
          name: verified-stable-packages
          path: qualified/
          if-no-files-found: error
          retention-days: 30
    outputs:
      artifact_id: ${{ steps.verified.outputs.artifact-id }}
  publish:
    if: github.event_name == 'workflow_dispatch' && !inputs.verify_publisher_only
    needs: verify
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.4xx'
      - name: Retrieve and reverify exact candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:VERIFIED_ARTIFACT_ID/zip" > qualified.zip
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed.' }
          Expand-Archive qualified.zip qualified
          ./eng/assert-production-ready.ps1 -Stage Publish -EvidenceDirectory qualified/evidence -PackageDirectory qualified/packages
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: login
        with:
          # Public profile selected by the user; authorization comes from OIDC.
          user: kirakosyan
      - name: Push qualified package and symbol bytes
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'Missing short-lived OIDC publishing credential.' }
          foreach ($package in Get-ChildItem qualified/packages -Filter '*.nupkg') {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) { throw "Package publication failed: $($package.Name)" }
          }

  core-verify:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'kirakosyan/pdf.net' && github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.core_candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify core release tag and successful main-run provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          $main = (git rev-parse origin/main).Trim()
          $tag = (git rev-parse 'v1.0.0^{commit}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tag -cne $head -or $main -cne $head) { throw 'Core tag must match the current main release commit.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CORE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $head -or $run.event -cne 'push' -or $run.conclusion -cne 'success' -or $run.path -cne '.github/workflows/ci.yml' -or $run.head_repository.full_name -cne 'kirakosyan/pdf.net') { throw 'Foreign or incomplete core release verification.' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: core-release-verified
          path: qualified
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Reverify exact core package inventory and raw consumer evidence
        run: python3 eng/core_release.py verify --directory qualified
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: core_candidate
        with:
          name: verified-core-publish-artifact
          path: qualified/
          if-no-files-found: error
          retention-days: 90

  core-publish:
    needs: core-verify
    runs-on: ubuntu-24.04
    environment: nuget
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            10.0.4xx
            8.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.core-verify.outputs.artifact_id }}
          path: qualified
          merge-multiple: true
          digest-mismatch: error
      - name: Reverify exact core candidate before obtaining publishing credentials
        run: python3 eng/core_release.py verify --directory qualified
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: core_login
        with:
          user: kirakosyan
      - name: Push scoped core and symbol bytes
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.core_login.outputs.NUGET_API_KEY }}
        run: ./eng/push-core.ps1 -Directory qualified
      - name: Verify public indexing, repository signature and every reviewed payload byte
        run: python3 eng/core_release.py public --directory qualified
      - name: Execute fresh NuGet-only package consumers
        shell: pwsh
        run: ./eng/core-release.ps1 -Stage Consumers -Directory qualified -HostId linux-x64 -OutputDirectory artifacts/public-core-consumers -PublicFeed
      - name: Publish release notes and verified artifact hashes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 --verify-tag --title 'Fluent.Pdf 1.0.0 — implemented core profiles' --notes-file docs/releases/1.0.0.md qualified/packages/Fluent.Pdf.1.0.0.nupkg qualified/packages/Fluent.Pdf.1.0.0.snupkg qualified/core-manifest.json qualified/core-evidence.json qualified/public-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release recording failed; preserve the already published NuGet evidence.' }
      - name: Retain public verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-publication-verification
          path: |
            qualified/core-manifest.json
            qualified/core-evidence.json
            qualified/public-verification.json
            artifacts/public-core-consumers/
            !artifacts/public-core-consumers/workspaces/**
          if-no-files-found: error
          retention-days: 90
