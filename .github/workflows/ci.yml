name: Source contracts and release guard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  framework-launcher:
    name: Windows PowerShell 5.1 launcher exits
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Exercise fast success, nonzero exits and immutable bundle boundaries
        shell: powershell
        run: ./eng/test-framework-runner.ps1 -OutputDirectory artifacts/framework-launcher-process
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framework-launcher-process-regressions
          path: artifacts/framework-launcher-process/
          if-no-files-found: error
  validate:
    name: Contracts (${{ matrix.id }})
    timeout-minutes: ${{ matrix.id == 'win-x64' && 60 || (matrix.id == 'osx-x64' && 40 || 20) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: win-x64, os: windows-latest, arch: X64 }
          - { id: win-arm64, os: windows-11-arm, arch: Arm64 }
          - { id: linux-x64, os: ubuntu-latest, arch: X64 }
          - { id: linux-arm64, os: ubuntu-24.04-arm, arch: Arm64 }
          - { id: osx-x64, os: macos-15-intel, arch: X64 }
          - { id: osx-arm64, os: macos-15, arch: Arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            10.0.4xx
            8.0.x
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Provision pinned independent archival source validator
        shell: pwsh
        run: ./eng/build-archival-fixture.ps1
      - name: Provision exact-edition independent invoice source validator
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/build-invoice-fixture.ps1
      - name: Validate specification and naming
        shell: pwsh
        run: ./eng/validate-spec.ps1
      - name: Verify release exception boundaries and status inventory
        shell: pwsh
        run: ./eng/test-release-policy.ps1 -OutputDirectory artifacts/contracts/release-policy
      - name: Check scoped core push argument and inventory boundaries offline
        shell: pwsh
        run: |
          ./eng/test-core-publish.ps1
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python eng/test-core-release.py
          if ($LASTEXITCODE -ne 0) { throw 'Core scope/runtime evidence regressions failed.' }
      - name: Verify source VM evidence and owned cleanup boundaries
        shell: pwsh
        run: |
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python eng/test-framework-vm.py
          if ($LASTEXITCODE -ne 0) { throw 'Source VM boundary regressions failed.' }
      - name: Observe actual Windows Framework host eligibility
        if: matrix.id == 'win-x64'
        shell: powershell
        run: ./eng/get-windows-release-host.ps1 -OutputPath artifacts/contracts/windows-host-preflight.json
      - name: Build original native worker and crash/isolation fixtures
        shell: pwsh
        run: ./eng/build-native-fixtures.ps1
      - name: Build original browser transport process peer
        shell: pwsh
        run: ./eng/build-browser-cli-fixture.ps1
      - name: Verify offline source provisioning and static import closure
        shell: pwsh
        run: |
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python eng/test-native-distribution.py
          if ($LASTEXITCODE -ne 0) { throw 'Offline source provisioning boundaries failed.' }
      - name: Enable Windows network isolation prerequisite on disposable runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
      - name: Restore locked dependencies
        run: dotnet restore Fluent.Pdf.slnx --locked-mode
      - name: Restore pinned API tooling
        run: dotnet tool restore
      - name: Inspect evaluated SDK package metadata without packing
        shell: pwsh
        run: ./eng/test-package-metadata.ps1 -OutputDirectory artifacts/contracts/package-metadata
      - name: Build SDK and executable C#/VB contracts
        run: dotnet build Fluent.Pdf.slnx -c Release --no-restore
      - name: Exercise offline installed real rendering source assets
        shell: pwsh
        run: |
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          $rid = '${{ matrix.id }}'
          $output = Join-Path $PWD 'artifacts/contracts/installed-renderer'
          $null = [IO.Directory]::CreateDirectory($output)
          & $python eng/test-installed-renderer.py --rid $rid --source (Join-Path $PWD "artifacts/native-fixtures/$rid") --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Offline actual-engine source installation failed.' }
      - name: Inventory source dependencies and check advisory query coverage
        shell: pwsh
        run: ./eng/audit-supply-chain.ps1 -OutputDirectory artifacts/contracts/supply-chain
      - name: Release completed build servers before API comparison
        run: dotnet build-server shutdown
      - name: Compare API across target frameworks
        shell: pwsh
        run: ./eng/check-api.ps1
      - name: Pack the explicitly scoped core and prepare package-only Framework consumers
        if: matrix.id == 'win-x64'
        shell: pwsh
        run: ./eng/core-release.ps1 -Stage Pack -Directory artifacts/core-release
      - name: Retain exact core candidate and consumer launchers
        if: matrix.id == 'win-x64' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-release-candidate
          path: |
            artifacts/core-release/packages/
            artifacts/core-release/core-manifest.json
            artifacts/core-release/package-audit.json
            artifacts/core-release/source-probes/
            artifacts/core-release/framework/
          if-no-files-found: error
      - name: Prepare offline Framework source bundle
        id: framework_bundle
        if: matrix.id == 'win-x64'
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng/test-framework-runner.ps1 -OutputDirectory artifacts/contracts/framework-runner-regressions
          if ($LASTEXITCODE -ne 0) { throw 'Offline launcher regressions failed.' }
          $package = 'artifacts/microsoft.testplatform.18.11.0.nupkg'
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/microsoft.testplatform/18.11.0/microsoft.testplatform.18.11.0.nupkg -OutFile $package
          ./eng/new-framework-test-bundle.ps1 -OutputDirectory artifacts/framework-source-bundle -TestPlatformPackage $package -JavaHome $env:JAVA_HOME -CoreReleaseDirectory artifacts/core-release
      - name: Retain offline Framework source bundle
        if: matrix.id == 'win-x64' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framework-source-bundle-win-x64
          path: artifacts/framework-source-bundle/
          if-no-files-found: error
          # Preserve the pinned tool package's .signature.p7s and all hashed inputs.
          include-hidden-files: true
      - name: Execute source contracts and verify runtime identity
        shell: pwsh
        run: ./eng/test-contracts.ps1 -ExpectedArchitecture '${{ matrix.arch }}'
      - name: Verify unqualified publication stays blocked
        shell: pwsh
        run: ./eng/test-release-block.ps1
      - name: Execute offline Framework source consumers
        if: ${{ !cancelled() && steps.framework_bundle.outcome == 'success' }}
        shell: pwsh
        run: |
          foreach ($architecture in @('x64','x86')) {
            # Exercise the exact offline entry point with Windows PowerShell 5.1.
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File artifacts/framework-source-bundle/run-framework-bundle.ps1 -Architecture $architecture -OutputDirectory "artifacts/contracts/offline-framework-$architecture" -WorkspaceDirectory "artifacts/framework-source-workspaces/$architecture"
            if ($LASTEXITCODE -ne 0) { throw 'Offline Framework source consumer failed.' }
            python eng/check-runtime-evidence.py --lane "win-$architecture-framework-current" --trx "artifacts/contracts/offline-framework-$architecture/runtime-contracts.trx" --mode source --output "artifacts/contracts/offline-framework-$architecture/runtime-identity.json"
            if ($LASTEXITCODE -ne 0) { throw 'Offline Framework runtime identity failed.' }
          }
      - name: Prepare exact source inputs for the minimum-Framework VM
        if: matrix.id == 'win-x64' && success()
        shell: pwsh
        run: ./eng/prepare-framework-vm.ps1 -BundleDirectory artifacts/framework-source-bundle -BaselineDirectory artifacts/contracts -OutputDirectory artifacts/framework-vm-source-setup
      - name: Retain minimum-Framework VM source setup
        if: matrix.id == 'win-x64' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framework-vm-source-setup
          path: artifacts/framework-vm-source-setup/
          if-no-files-found: error
          include-hidden-files: true
      - name: Retain macOS sandbox diagnostics after a native failure
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          log show --last 10m --style compact --predicate 'eventMessage CONTAINS "Sandbox:" OR eventMessage CONTAINS "native-aot" OR process == "sandboxd"' | tail -160
      - name: Retain isolated native runtime startup comparisons on macOS
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: python3 eng/diagnose-native-runtime.py
      - name: Retain source contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-contracts-${{ matrix.id }}
          path: |
            artifacts/contracts/
            !artifacts/contracts/supply-chain/fresh-advisory-cache/**
          if-no-files-found: error

  minimum-framework:
    name: Actual Framework 4.7.2 source (x86 and x64)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check VM evidence rejection and cleanup controls
        run: python3 eng/test-framework-vm.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: framework-vm-source-setup
          path: artifacts/framework-vm-source-setup
      - name: Reclaim unused tools only on this dedicated disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          # This job executes prebuilt Windows tests; it does not use these SDKs.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /opt/google /opt/microsoft /usr/local/share/chromium
          if test -c /dev/kvm; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod 600 /dev/kvm
          fi
      - name: Execute both actual minimum-Framework source lanes
        run: >-
          python3 eng/framework-vm.py
          --setup artifacts/framework-vm-source-setup
          --work artifacts/framework-vm-owned-state
          --results artifacts/framework-vm-source-evidence
          --commit "$GITHUB_SHA"
          --timeout-seconds 4500
      - name: Retain source reports, archive and owned-resource receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framework472-source-evidence-attempt-${{ github.run_attempt }}
          path: artifacts/framework-vm-source-evidence/
          if-no-files-found: error

  reproducibility:
    name: Managed source rebuild provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.4xx
      - name: Compare fresh deterministic builds and embedded SourceLink
        shell: pwsh
        run: ./eng/test-rebuild.ps1 -OutputDirectory artifacts/source-rebuild
      - name: Exercise API maintenance and blocked release gates
        run: |
          dotnet tool restore
          python3 eng/test-maintenance.py --output artifacts/source-maintenance
      - name: Verify offline publishing credential argument wiring
        shell: pwsh
        run: ./eng/test-publish-token.ps1
      - name: Retain source provenance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-rebuild-provenance
          path: |
            artifacts/source-rebuild/*.log
            artifacts/source-rebuild/report.json
            artifacts/source-rebuild/probes/*.json
            artifacts/source-maintenance/**
            artifacts/contracts/publish-token/**/report.json
          if-no-files-found: error

  core-consumers:
    name: Core package (${{ matrix.id }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: win-x64, os: windows-latest }
          - { id: win-arm64, os: windows-11-arm }
          - { id: linux-x64, os: ubuntu-latest }
          - { id: linux-arm64, os: ubuntu-24.04-arm }
          - { id: osx-x64, os: macos-15-intel }
          - { id: osx-arm64, os: macos-15 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            10.0.4xx
            8.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: core-release-candidate
          path: artifacts/core-release
          digest-mismatch: error
      - name: Restore and execute fresh exact-package consumers
        shell: pwsh
        run: ./eng/core-release.ps1 -Stage Consumers -Directory artifacts/core-release -HostId '${{ matrix.id }}' -OutputDirectory artifacts/core-consumers
      - name: Retain actual consumer outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-consumers-${{ matrix.id }}
          path: |
            artifacts/core-consumers/
            !artifacts/core-consumers/workspaces/**
          if-no-files-found: error

  core-independent:
    name: Independently inspect generated core-package PDFs
    needs: core-consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: core-release-candidate
          path: artifacts/core-release
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: core-consumers-linux-x64
          path: artifacts/consumer
          digest-mismatch: error
      - name: Provision independent PDF readers and inspect exact fixture bytes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qpdf poppler-utils
          python3 eng/core_release.py independent --directory artifacts/core-release --reports artifacts/consumer --output artifacts/independent
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-independent
          path: artifacts/independent/
          if-no-files-found: error

  core-evidence:
    name: Bind and archive verified core release
    needs: [framework-launcher, validate, minimum-framework, reproducibility, core-consumers, core-independent]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: core-release-candidate
          path: artifacts/core-release
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: core-consumers-*
          path: artifacts/core-reports
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: framework472-source-evidence-attempt-${{ github.run_attempt }}
          path: artifacts/core-reports/minimum-framework
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: core-independent
          path: artifacts/core-reports/independent
          digest-mismatch: error
      - name: Reconcile all 22 actual package-consumer lanes and exact payload
        run: |
          python3 eng/core_release.py collect --directory artifacts/core-release --reports artifacts/core-reports
          python3 eng/core_release.py verify --directory artifacts/core-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-release-verified
          path: artifacts/core-release/
          if-no-files-found: error
          retention-days: 90
