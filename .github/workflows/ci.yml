name: Foundation integrity
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.4xx'
      - name: Validate specification and naming
        shell: pwsh
        run: ./eng/validate-spec.ps1
      - name: Restore locked dependencies
        run: dotnet restore Fluent.Pdf.slnx --locked-mode
      - name: Build project boundaries
        run: dotnet build Fluent.Pdf.slnx -c Release --no-restore
      - name: Verify unqualified publication stays blocked
        shell: pwsh
        run: ./eng/test-release-block.ps1
